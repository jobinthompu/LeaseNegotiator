# Declarative Google Cloud Run (Knative) deployment manifest.
# Deploy with:
#   gcloud run services replace deploy/cloudrun-service.yaml --region=us-west1
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: lease-negotiator
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/description: "Multi-agent Google ADK Car Lease Negotiation Service"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 300
      serviceAccountName: lease-negotiator-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - name: lease-negotiator
          image: us-west1-docker.pkg.dev/PROJECT_ID/containers/lease-negotiator:0.2.0
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: DEPLOYMENT_ENV
              value: "production"
            - name: LOG_FORMAT
              value: "json"
            - name: LOG_LEVEL
              value: "INFO"
            - name: OTEL_SERVICE_NAME
              value: "lease-negotiator"
            - name: SERVE_ADK_WEB_UI
              value: "false"
            - name: HITL_REQUIRE_OUTREACH_APPROVAL
              value: "true"
            - name: SHOPPER_ZIP_CODE
              value: "94550"
            - name: LOCAL_SALES_TAX_PERCENT
              value: "10.25"
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: lease-negotiator-gemini-api-key
                  key: latest
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
