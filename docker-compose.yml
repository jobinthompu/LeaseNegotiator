services:
  lease-negotiator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-FALSE}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      OTEL_SERVICE_NAME: lease-negotiator
      DEPLOYMENT_ENV: local-compose
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      SERVE_ADK_WEB_UI: "true"
      SHOPPER_ZIP_CODE: ${SHOPPER_ZIP_CODE:-94550}
      LOCAL_SALES_TAX_PERCENT: ${LOCAL_SALES_TAX_PERCENT:-10.25}
    volumes:
      - lease_state:/app/.lease_data
    depends_on:
      jaeger:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger Distributed Trace UI -> http://localhost:16686
      - "4318:4318"    # OTLP HTTP receiver

volumes:
  lease_state:
