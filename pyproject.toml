[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lease-negotiator"
version = "0.2.0"
description = "Production-grade multi-agent car lease negotiation platform built with Google ADK, Gemini tiered routing, async vector memory, OpenTelemetry tracing, PII guardrails, and HITL controls."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
  "car-lease",
  "lease-negotiation",
  "google-adk",
  "gemini",
  "multi-agent",
  "opentelemetry",
  "vector-memory",
  "guardrails",
  "human-in-the-loop",
]
dependencies = [
  "google-adk>=2.0.0",
  "google-genai>=1.10.0",
  "pydantic>=2.10.0,<3.0.0",
  "python-dotenv>=1.0.1",
  "aiosqlite>=0.20.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-otlp-proto-http>=1.28.0",
]

[project.optional-dependencies]
vector = [
  "chromadb>=0.6.0",
]
db = [
  "sqlalchemy[asyncio]>=2.0.30",
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.7.0",
  "mypy>=1.11.0",
  "bandit>=1.7.9",
  "pip-audit>=2.7.3",
]

[project.scripts]
lease-negotiator-server = "lease_negotiator.server:main"

[tool.setuptools.packages.find]
include = ["lease_negotiator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "integration: runs live Gemini/ADK calls (requires GOOGLE_API_KEY)",
]

[tool.coverage.run]
source = ["lease_negotiator"]
omit = ["lease_negotiator/server.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101"]
